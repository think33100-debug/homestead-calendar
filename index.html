<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f5f7">
<title>홈스테드 청소 일정</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231565ff%22/%3E%3Cpath d=%22M14 30 32 15l18 15v19H38V37H26v12H14z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="홈스테드 청소">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{ --bg:#f4f5f7; --card:#fff; --line:#e9eaee; --muted:#6b7079; --text:#1b1d22; --blue:#1565ff;
         --clean:#1565ff; --stay:#e8590c; --done:#0c8a4c; --wait:#b45309; --sun:#e0402f;
         --col:52px; --rowh:48px; --head:54px; --left:64px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;-webkit-text-size-adjust:100%}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  #app{max-width:720px;margin:0 auto}

  header{display:flex;align-items:center;gap:4px;padding:14px 16px 6px}
  header h1{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-right:auto}
  .ibtn{height:36px;min-width:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;color:#444;padding:0 8px}
  .ibtn.txt{font-size:13px;color:var(--muted)}
  .ibtn:active{background:#e6e8ec}

  .date{padding:0 16px 10px;display:flex;align-items:baseline;gap:8px}
  .date b{font-size:17px;font-weight:800}
  .date span{font-size:12px;color:var(--muted)}

  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 12px 14px}
  .sum > div{border-radius:14px;padding:10px 7px 10px 8px;min-width:0;border:1.5px solid transparent}
  .sum .k{font-size:11.5px;font-weight:800;line-height:1.3;letter-spacing:-.5px;white-space:nowrap}
  .sum .k em{display:block;font-style:normal;font-weight:600;font-size:11px;opacity:.75}
  .sum .v{font-size:24px;font-weight:900;margin-top:4px;line-height:1}
  .sum .v small{font-size:12px;font-weight:700;margin-left:1px}
  .sum .c{background:#e8f0ff;border-color:#c9dbff} .sum .c .k,.sum .c .v{color:#1450d8}
  .sum .w{background:#fff4e0;border-color:#ffdca3} .sum .w .k,.sum .w .v{color:#a35200}
  .sum .d{background:#e4f6ec;border-color:#b8e6cc} .sum .d .k,.sum .d .v{color:#0a7a43}

  .floor{margin:0 16px 14px}
  .fh{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;flex-wrap:wrap}
  .fh h2{font-size:15px;font-weight:900;color:#fff;background:#1b1d22;padding:3px 10px;border-radius:8px}
  .fh .tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e9ebef;color:#555;white-space:nowrap}
  .tag.clean{background:#e7efff;color:var(--clean)} .tag.stay{background:#fff0e5;color:var(--stay)}
  .tag.done{background:#e3f5ea;color:var(--done)} .tag.wait{background:#fff1db;color:var(--wait)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--card);border-radius:14px;padding:12px 12px 11px;text-align:left;position:relative;overflow:hidden;min-height:98px}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rc)}
  .tile .rn{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;padding-left:4px}
  .tile .rn .car{font-size:14px}
  .tile .st{margin-top:6px;padding-left:4px;font-size:14px;font-weight:800}
  .tile .sb{margin-top:3px;padding-left:4px;font-size:12px;color:#555a63;line-height:1.4;font-weight:500}
  .tile .badge{position:absolute;right:10px;top:12px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#eef0ff;color:#4b5bd4}
  .tile.clean .st{color:var(--clean)} .tile.stay .st{color:var(--stay)} .tile.done .st{color:var(--done)} .tile.wait .st{color:var(--wait)}
  .tile.clean{background:#f3f7ff} .tile.stay{background:#fff6ef} .tile.done{background:#f2fbf6} .tile.wait{background:#fffaf1}
  .tile .rn{color:var(--rc)}
  .tile:active{transform:scale(.98)}

  .tlh{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 8px}
  .tlh h2{font-size:16px;font-weight:800}
  .tlh span{font-size:12px;color:var(--muted)}
  .tl-wrap{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tl-wrap::-webkit-scrollbar{display:none}
  .tl{display:grid;grid-template-columns:var(--left) repeat(14, var(--col));position:relative;width:max-content}
  .cell{height:var(--rowh);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell.past{background:#fafafb} .cell.t{background:#eef4ff}
  .hd{height:var(--head);display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);background:#fff}
  .hd b{font-size:15px;color:var(--text);font-weight:600;line-height:1.35}
  .hd.sun,.hd.sun b{color:var(--sun)} .hd.sat,.hd.sat b{color:var(--blue)}
  .hd.t b{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
  .rm{position:sticky;left:0;z-index:3;background:#fff;height:var(--rowh);display:flex;align-items:center;gap:5px;padding-left:8px;
      font-weight:800;font-size:13px;white-space:nowrap;border-right:1px solid #dcdee3;border-bottom:1px solid var(--line)}
  .rm i{width:9px;height:9px;border-radius:3px;flex:none}
  .corner{position:sticky;left:0;z-index:4;background:#fff;height:var(--head);border-right:1px solid #dcdee3;border-bottom:1px solid var(--line)}
  .fl{grid-column:1 / -1;height:26px;background:#f1f2f5;border-bottom:1px solid var(--line)}
  .fl span{position:sticky;left:8px;font-size:12px;font-weight:900;color:#1b1d22;line-height:26px;padding-left:8px}
  .bar{position:absolute;height:28px;border-radius:8px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;
       padding:0 6px;white-space:nowrap;overflow:hidden;z-index:2;cursor:pointer;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .bar.contL{border-top-left-radius:0;border-bottom-left-radius:0}
  .bar .sub{font-weight:500;opacity:.9;margin-left:4px}
  .out{position:absolute;font-size:11px;line-height:1;z-index:2;pointer-events:none}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);padding:10px 18px 4px}
  .note{font-size:11px;color:#a3a7ae;padding:2px 18px 4px;line-height:1.5}
  .stamp{font-size:11px;color:#b5b9c0;text-align:center;padding:10px 0 40px}

  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#222;color:#fff;font-size:13px;
         padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;z-index:50;
         padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.22s;max-height:85vh;overflow:auto}
  .sheet.on{transform:none} .sheet-bg.on{display:block}
  .grab{width:40px;height:4px;border-radius:2px;background:#d9dbe0;margin:0 auto 12px}
  .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sh .sq{width:14px;height:14px;border-radius:4px}
  .sh h3{font-size:22px;font-weight:800}
  .sh .tag{margin-left:auto}
  .sc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .sc .tt{font-size:13px;font-weight:800;margin-bottom:8px}
  .kv{display:grid;grid-template-columns:84px 1fr;gap:8px 10px;font-size:14px}
  .kv dt{color:var(--muted)} .kv dd{font-weight:700;color:#1b1d22}
  .btn{width:100%;margin-top:8px;padding:14px;border-radius:12px;font-weight:700;font-size:15px;background:#f1f2f4}
  .btn.primary{background:var(--blue);color:#fff}

  .connect{max-width:420px;margin:60px auto;padding:0 20px}
  .connect h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .connect p{font-size:14px;color:#777;line-height:1.5;margin-bottom:8px}
  .connect input{width:100%;font:inherit;font-size:20px;letter-spacing:4px;text-align:center;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0 10px;background:#fff}
  .err{color:#c62e22;font-size:13px;margin-top:10px;min-height:18px;text-align:center}

  @media (min-width:600px){ .tiles{grid-template-columns:repeat(4,1fr)} }

  .install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:55;
           background:#1b1d22;color:#fff;border-radius:16px;padding:14px;display:none;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .install.on{display:flex}
  .install img{width:44px;height:44px;border-radius:11px;flex:none}
  .install .tx{flex:1;font-size:13px;line-height:1.45} .install .tx b{font-size:15px;display:block}
  .install .ib{display:flex;flex-direction:column;gap:6px}
  .install button{font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--blue);color:#fff;white-space:nowrap}
  .install button.no{background:transparent;color:#aab;padding:4px}
  .loading{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>홈스테드 청소 일정</h1>
    <button class="ibtn" id="btnSync" title="새로고침">⟳</button>
    <button class="ibtn txt" id="btnOut">나가기</button>
  </header>
  <div class="date" id="date"></div>
  <div class="sum" id="sum"></div>
  <div id="floors"></div>

  <div class="tlh"><h2>2주 일정</h2><span>지난 3일 · 오늘 · 앞으로 10일</span></div>
  <div class="tl-wrap" id="wrap"><div class="tl" id="tl"></div></div>
  <div class="legend"><span>🧹 퇴실(청소)하는 날</span><span>🚗 차량 등록</span><span>막대 = 실제 입실 기간</span></div>
  <p class="note">벤디트 키오스크에서 입실 인증한 손님만 표시됩니다. 앞으로의 일정은 현재 묵고 계신 손님의 퇴실 예정만 보입니다.</p>
  <div class="stamp" id="stamp"></div>
</div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="install" id="install">
  <img src="icon-192.png" alt="">
  <div class="tx" id="instTx"><b>앱으로 설치하시겠습니까?</b>홈 화면에 추가하면 앱처럼 바로 열 수 있습니다.</div>
  <div class="ib"><button id="instYes">설치</button><button class="no" id="instNo">나중에</button></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwRayqUibLasSQ94BUbcrCfeskmmLYZgy0pmalKYSCtQtiZqIS8EGwxwWcU2mn9-5yDsg/exec';
const DEMO = new URLSearchParams(location.search).has('demo');
const PAST = 3, DAYS = 14;
const FLOORS = [ { name:'1층', rooms:['101호','102호','103호','104호'] }, { name:'2층', rooms:['201호','202호','203호','204호'] } ];
// 객실별 고유 색 (흰 글씨가 잘 보이는 진한 톤)
const RC = { '101호':'#2F6FED', '102호':'#E0457B', '103호':'#D97706', '104호':'#0E9F6E',
             '201호':'#7C3AED', '202호':'#0891B2', '203호':'#DC2626', '204호':'#475569' };

const store = {
  get(k){ try { return localStorage.getItem('hs_'+k) || ''; } catch(_) { return ''; } },
  set(k,v){ try { localStorage.setItem('hs_'+k, v); } catch(_){} },
  del(k){ try { localStorage.removeItem('hs_'+k); } catch(_){} },
};
(function importHash(){
  if (!/key=/.test(location.hash)) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('key')) store.set('key', h.get('key'));
  history.replaceState(null, '', location.pathname + location.search);
})();

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const W = ['일','월','화','수','목','금','토'];
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const mdw = s => `${md(s)}(${W[parse(s).getDay()]})`;
const longDT = s => s ? `${+s.slice(5,7)}월 ${+s.slice(8,10)}일(${W[parse(s.slice(0,10)).getDay()]}) ${s.slice(11)}` : '-';
const hm = s => (s || '').slice(11);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasCar = v => { const c = String(v.car || '').trim(); return !!c && !/없음|미방문|^-$/.test(c); };
const css = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

const ROOMS = FLOORS.flatMap(f => f.rooms);
let LIST = [], TODAY = ymd(new Date()), NOW = '';

async function call(action, extra){
  if (DEMO) return MOCK[action] ? MOCK[action]() : true;
  const key = store.get('key');
  if (!key) throw new Error('nocfg');
  const res = await fetch(API, { method:'POST', redirect:'follow', body: JSON.stringify(Object.assign({ key, action }, extra || {})) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'fail');
  return j.data;
}

// 마지막으로 받은 데이터를 폰에 저장 → 다음에 열 때 바로 표시하고 뒤에서 최신으로 교체
const CACHE_KEY = 'hs_cache_v1';
function readCache(){ try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(_) { return null; } }
function writeCache(d){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch(_){} }
function apply(d){ LIST = d.list || []; TODAY = d.today || TODAY; NOW = d.now || ''; render(); }

let firstPaint = false;
async function load(){
  if (!firstPaint && !DEMO && store.get('key')) {
    const c = readCache();
    if (c && c.today === ymd(new Date())) { apply(c); $('app').classList.add('loading'); }
    firstPaint = true;
  }
  const start = ymd(addD(parse(TODAY), -PAST)), end = ymd(addD(parse(TODAY), DAYS - PAST));
  try {
    const d = await call('data', { from: start, to: end });
    if (!DEMO) writeCache(d);
    apply(d);
    $('app').classList.remove('loading');
  } catch(err){
    $('app').classList.remove('loading');
    if (err.message === 'key' || err.message === 'nocfg') return showLogin(err.message === 'key' ? '비밀번호가 맞지 않습니다.' : '');
    if (err.message === 'locked') return showLogin('비밀번호를 여러 번 틀려 10분간 잠겼습니다.');
    toast('불러오지 못했습니다'); console.error(err);
  }
}

/**
 * 객실별 오늘 상태 (오늘 아침 기준)
 *  out  : 어젯밤 이전 입실 → 오늘 퇴실 (청소)
 *  stay : 어젯밤 이전 입실 → 내일 이후 퇴실 (연박)
 *  inn  : 오늘 입실 인증
 *  next : 오늘 밤 묵는 손님이 내일 퇴실
 */
function roomState(room){
  const rs = LIST.filter(v => v.room === room);
  const before = rs.filter(v => v.ci < TODAY && v.co >= TODAY).sort((a,b) => a.inAt < b.inAt ? 1 : -1)[0];
  const out = before && before.co === TODAY ? before : null;
  const stay = before && before.co > TODAY ? before : null;
  const inn = rs.filter(v => v.ci === TODAY).sort((a,b) => a.inAt < b.inAt ? 1 : -1)[0] || null;
  const tonight = stay || inn;
  const next = !!(tonight && tonight.co === ymd(addD(parse(TODAY), 1)));
  let key, label, sub;
  if (out) { key = 'clean'; label = '🧹 오늘 청소';
             sub = inn ? `새 손님 ${hm(inn.inAt)} 입실 완료` : `${md(out.ci)} 입실 · 오늘 퇴실`; }
  else if (stay) { const total = diff(stay.ci, stay.co), day = diff(stay.ci, TODAY) + 1;
             key = 'stay'; label = '⛔ 연박 중 · 출입금지'; sub = `${total}박 중 ${day}일차 · ${mdw(stay.co)} 퇴실`; }
  else if (inn) { key = 'done'; label = `✓ 입실 완료 ${hm(inn.inAt)}`; sub = `${mdw(inn.co)} 퇴실 예정 (${diff(inn.ci, inn.co)}박)`; }
  else { key = 'wait'; label = '아직 체크인 전'; sub = '오늘 입실 인증 없음'; }
  return { key, label, sub, out, stay, inn, next, car: !!(tonight && hasCar(tonight)) };
}

function render(){
  const td = parse(TODAY);
  $('date').innerHTML = `<b>오늘 ${md(TODAY)}(${W[td.getDay()]})</b><span>${NOW ? '업데이트 ' + esc(NOW.slice(11)) : ''}</span>`;

  const st = {}; ROOMS.forEach(r => st[r] = roomState(r));
  const cnt = (rooms, k) => rooms.filter(r => st[r].key === k).length;
  const waitN = rooms => rooms.filter(r => !st[r].inn && !st[r].stay).length;
  $('sum').innerHTML = `
    <div class="c"><div class="k">1층 청소<em>오늘 ${md(TODAY)}</em></div><div class="v">${cnt(FLOORS[0].rooms,'clean')}<small>곳</small></div></div>
    <div class="c"><div class="k">2층 청소<em>오늘 ${md(TODAY)}</em></div><div class="v">${cnt(FLOORS[1].rooms,'clean')}<small>곳</small></div></div>
    <div class="w"><div class="k">체크인 전<em>오늘 ${md(TODAY)}</em></div><div class="v">${waitN(ROOMS)}<small>곳</small></div></div>
    <div class="d"><div class="k">체크인 완료<em>오늘 ${md(TODAY)}</em></div><div class="v">${ROOMS.filter(r => st[r].inn).length}<small>곳</small></div></div>`;

  $('floors').innerHTML = FLOORS.map(f => {
    const c = cnt(f.rooms,'clean'), s = cnt(f.rooms,'stay'), d = f.rooms.filter(r => st[r].inn).length, w = waitN(f.rooms);
    return `<section class="floor">
      <div class="fh"><h2>${f.name}</h2><div class="tags">
        <span class="tag clean">🧹 청소 ${c}</span>${s ? `<span class="tag stay">⛔ 연박 ${s}</span>` : ''}
        ${d ? `<span class="tag done">✓ 입실 ${d}</span>` : ''}${w ? `<span class="tag wait">체크인 전 ${w}</span>` : ''}</div></div>
      <div class="tiles">${f.rooms.map(r => { const x = st[r]; return `
        <button class="tile ${x.key}" style="--rc:${RC[r]}" data-room="${r}">
          <div class="rn">${r}${x.car ? '<span class="car">🚗</span>' : ''}</div>
          ${x.next ? '<span class="badge">내일 퇴실</span>' : ''}
          <div class="st">${esc(x.label)}</div><div class="sb">${esc(x.sub)}</div>
        </button>`; }).join('')}</div></section>`;
  }).join('');
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => openRoom(b.dataset.room, st[b.dataset.room]));

  renderTimeline();
  $('stamp').textContent = NOW ? `마지막 불러온 시각 ${NOW}` : '';
}

function renderTimeline(){
  const td = parse(TODAY), start = addD(td, -PAST);
  const days = Array.from({length: DAYS}, (_,i) => addD(start, i)), ds = days.map(ymd);
  let h = '<div class="corner"></div>';
  days.forEach((d,i) => {
    const cls = ['hd', d.getDay()===0?'sun':'', d.getDay()===6?'sat':'', ds[i]===TODAY?'t':''].join(' ');
    h += `<div class="${cls}">${W[d.getDay()]}<b>${d.getDate()}</b></div>`;
  });
  FLOORS.forEach(f => {
    h += `<div class="fl"><span>${f.name}</span></div>`;
    f.rooms.forEach(room => {
      h += `<div class="rm" data-rm="${room}" style="color:${RC[room]}"><i style="background:${RC[room]}"></i>${room}</div>`;
      ds.forEach(s => h += `<div class="cell ${s<TODAY?'past':''} ${s===TODAY?'t':''}"></div>`);
    });
  });
  $('tl').innerHTML = h;

  const colW = css('--col'), rowH = css('--rowh'), left = css('--left');
  const rowTop = {}; document.querySelectorAll('.rm').forEach(e => rowTop[e.dataset.rm] = e.offsetTop);
  const IN = 0.5, OUT = 0.42;   // 입실 = 칸 가운데(오후), 퇴실 = 칸 앞쪽(오전)
  LIST.forEach(v => {
    if (!(v.room in rowTop)) return;
    const s = diff(ds[0], v.ci), e = diff(ds[0], v.co);
    const x1 = Math.max(s + IN, 0), x2 = Math.min(e + OUT, DAYS);
    const top = rowTop[v.room];
    if (x2 > x1) {
      const el = document.createElement('div');
      const w = (x2 - x1) * colW - 2, n = diff(v.ci, v.co);
      el.className = 'bar' + (s + IN < 0 ? ' contL' : '');
      el.style.cssText = `left:${left + x1*colW + 1}px;width:${w}px;top:${top + rowH - 28 - 6}px;background:${RC[v.room]}`;
      el.innerHTML = (hasCar(v) ? '🚗' : '') + (w < 76 ? `${n}박` : `${esc(hm(v.inAt))}<span class="sub">${n}박</span>`);
      el.onclick = () => openStay(v);
      $('tl').appendChild(el);
    }
    if (e >= 0 && e < DAYS) {
      const m = document.createElement('div');
      m.className = 'out'; m.textContent = '🧹';
      m.style.cssText = `left:${left + e*colW + 3}px;top:${top + 3}px`;
      $('tl').appendChild(m);
    }
  });
  requestAnimationFrame(() => { $('wrap').scrollLeft = 0; });
}

// ── 상세 ──
function stayCard(v, title){
  return `<div class="sc"><div class="tt">${title}</div><dl class="kv">
    <dt>입실</dt><dd>${esc(longDT(v.inAt))}</dd>
    <dt>퇴실 예정</dt><dd>${esc(longDT(v.outAt))}</dd>
    <dt>숙박</dt><dd>${diff(v.ci, v.co)}박</dd>
    <dt>차량</dt><dd>${hasCar(v) ? '🚗 ' + esc(v.car) : '등록 안 함'}</dd>
    <dt>입실 구분</dt><dd>${esc(v.kind || '-')}</dd>
    <dt>벤디트 번호</dt><dd>${esc(v.id || '-')}</dd></dl></div>`;
}
function sheetHead(room, tagHtml){ return `<div class="grab"></div><div class="sh"><span class="sq" style="background:${RC[room]}"></span><h3>${room}</h3>${tagHtml||''}</div>`; }
function openRoom(room, x){
  const tag = { clean:'<span class="tag clean">🧹 오늘 청소</span>', stay:'<span class="tag stay">⛔ 연박 중</span>',
                done:'<span class="tag done">✓ 입실 완료</span>', wait:'<span class="tag wait">체크인 전</span>' }[x.key];
  let body = '';
  if (x.out)  body += stayCard(x.out, '🧹 오늘 퇴실하는 손님');
  if (x.stay) body += stayCard(x.stay, '⛔ 묵고 계신 손님 (출입금지)');
  if (x.inn)  body += stayCard(x.inn, `✓ 오늘 ${hm(x.inn.inAt)}에 입실한 손님`);
  if (!x.inn && !x.stay) body += `<div class="sc"><div class="tt">오늘(${md(TODAY)}) 아직 체크인 전입니다</div>
    <div style="font-size:13px;color:var(--muted);line-height:1.5">손님이 키오스크에서 입실 인증을 하시면 자동으로 표시됩니다.</div></div>`;
  openSheet(sheetHead(room, tag) + body + '<button class="btn" id="cls">닫기</button>');
}
function openStay(v){ openSheet(sheetHead(v.room) + stayCard(v, `${mdw(v.ci)} 입실 손님`) + '<button class="btn" id="cls">닫기</button>'); }
function openSheet(html){ $('sheet').innerHTML = html; $('cls').onclick = closeSheet; $('bg').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet(){ $('bg').classList.remove('on'); $('sheet').classList.remove('on'); }
$('bg').onclick = closeSheet;

// ── 로그인 ──
function showLogin(msg){
  $('app').style.display = 'none';
  document.getElementById('login')?.remove();
  const box = document.createElement('div');
  box.className = 'connect'; box.id = 'login';
  box.innerHTML = `<h2>홈스테드 청소 일정</h2><p>비밀번호를 입력해 주세요.</p>
    <input id="cKey" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호">
    <button class="btn primary" id="cGo">들어가기</button><div class="err">${esc(msg||'')}</div>`;
  document.body.appendChild(box);
  const go = () => { const k = $('cKey').value.trim(); if (!k) return;
    store.set('key', k); box.remove(); $('app').style.display = ''; load(); };
  $('cGo').onclick = go;
  $('cKey').onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => $('cKey').focus(), 50);
}
$('btnOut').onclick = () => { if (confirm('로그아웃하시겠습니까?')) { store.del('key'); try { localStorage.removeItem(CACHE_KEY); } catch(_){} showLogin(''); } };
$('btnSync').onclick = async () => { toast('새로고침 중입니다'); try { await call('sync'); await load(); toast('최신 상태입니다'); } catch(e){ toast('새로고침하지 못했습니다'); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('login')) load(); });

// ── 데모 (?demo) — 가상의 데이터 ──
const MOCK = {
  data: () => {
    const t = new Date(), D = n => ymd(addD(t, n));
    let i = 0;
    const V = (room, a, b, t1, car) => ({ id: String(9000 + (++i)), room, ci: D(a), co: D(b),
      inAt: `${D(a)} ${t1}`, outAt: `${D(b)} 11:00`, kind: '예약입실', car: car || '차량없음' });
    return { today: D(0), now: `${D(0)} 12:30`,
      list: [ V('101호',-1,0,'20:10'), V('101호',0,1,'15:12','12가3456'), V('101호',-3,-1,'16:30'),
              V('102호',-2,1,'15:40','34나5678'), V('103호',-1,0,'22:05'),
              V('104호',0,2,'15:20'), V('201호',-1,0,'19:20','56다7890'), V('201호',-3,-1,'18:00'),
              V('202호',-3,2,'17:45'), V('203호',-3,-2,'21:10'), V('204호',-2,0,'23:40'), V('204호',0,1,'16:00') ] };
  }
};

// ── 앱 설치 (홈 화면 추가) ──
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(function installPrompt(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || DEMO) return;
  const until = +(localStorage.getItem('hs_inst_skip') || 0);
  if (Date.now() < until) return;
  const box = $('install'), skip = () => { box.classList.remove('on'); try { localStorage.setItem('hs_inst_skip', Date.now() + 7*864e5); } catch(_){} };
  $('instNo').onclick = skip;
  let deferred = null;
  // 안드로이드 크롬·삼성인터넷: 설치 창 바로 띄우기
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e; box.classList.add('on');
    $('instYes').onclick = async () => { box.classList.remove('on'); deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred = null; };
  });
  window.addEventListener('appinstalled', () => { box.classList.remove('on'); toast('설치되었습니다'); });
  // 아이폰 사파리: 자동 설치창이 없어 방법 안내
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios) {
    $('instTx').innerHTML = '<b>홈 화면에 추가하시겠습니까?</b>아래 <b style="display:inline">공유 버튼(□↑)</b> → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.';
    $('instYes').textContent = '확인'; $('instYes').onclick = skip;
    setTimeout(() => box.classList.add('on'), 1200);
  }
})();

load();
</script>
