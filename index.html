<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>홈스테드 입실현황</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231565ff%22/%3E%3Cpath d=%22M14 30 32 15l18 15v19H38V37H26v12H14z%22 fill=%22white%22/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{ --bg:#fff; --line:#ececec; --muted:#9a9a9a; --text:#1d1d1f; --blue:#1565ff; --sun:#e0402f;
         --today:#eef4ff; --past:#fafafa; --col:56px; --rowh:50px; --head:58px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

  header{display:flex;align-items:center;gap:4px;padding:14px 12px 10px}
  header h1{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-right:auto}
  header small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
  .ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#333}
  .ibtn:active{background:#f1f1f1}

  .today{margin:0 12px 12px;border-radius:16px;background:#f6f7f9;padding:14px}
  .today h2{font-size:14px;font-weight:700;color:#555;margin-bottom:10px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{background:#fff;border-radius:12px;padding:10px 12px}
  .card .k{font-size:12px;color:#888;font-weight:600}
  .card .v{font-size:22px;font-weight:800;margin:2px 0 6px}
  .card .rs{display:flex;flex-wrap:wrap;gap:4px}
  .card .rs span{font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;background:#f1f1f1}
  .card.clean .v{color:var(--blue)} .card.clean .rs span{background:#e8f0ff;color:var(--blue)}
  .card.stay  .v{color:#d9480f}     .card.stay .rs span{background:#fff0e6;color:#d9480f}
  .card.next  .v{color:#5b6bd6}     .card.next .rs span{background:#eef0ff;color:#5b6bd6}
  .card .none{font-size:12px;color:#bbb}

  .tl-wrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tl-wrap::-webkit-scrollbar{display:none}
  .tl{display:grid;grid-template-columns:60px repeat(14, var(--col));position:relative;width:max-content}
  .cell{height:var(--rowh);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell.past{background:var(--past)} .cell.t{background:var(--today)}
  .hd{height:var(--head);display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);background:#fff}
  .hd b{font-size:16px;color:var(--text);font-weight:600;line-height:1.3}
  .hd.sun,.hd.sun b{color:var(--sun)} .hd.sat,.hd.sat b{color:var(--blue)}
  .hd.t b{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
  .rm{position:sticky;left:0;z-index:3;background:#fff;height:var(--rowh);display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:14px;border-right:1px solid #ddd;border-bottom:1px solid var(--line)}
  .rm .dot{width:8px;height:8px;border-radius:50%;margin-right:5px}
  .corner{position:sticky;left:0;z-index:4;background:#fff;height:var(--head);border-right:1px solid #ddd;border-bottom:1px solid var(--line)}

  .bar{position:absolute;height:28px;border-radius:8px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;
       padding:0 7px;white-space:nowrap;overflow:hidden;z-index:2;cursor:pointer;line-height:1}
  .bar.contL{border-top-left-radius:0;border-bottom-left-radius:0}
  .bar .sub{font-weight:500;opacity:.85;margin-left:4px}
  .out{position:absolute;font-size:11px;line-height:1;z-index:2;pointer-events:none}
  .bar.narrow{padding:0 5px;font-size:11px}

  .legend{display:flex;gap:12px;font-size:12px;color:#777;padding:10px 14px}
  .stamp{font-size:11px;color:#bbb;text-align:center;padding:8px 0 40px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#222;color:#fff;font-size:13px;
         padding:8px 14px;border-radius:999px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
  .toast.on{opacity:1}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:50;padding:20px 18px 28px;transform:translateY(100%);transition:.22s}
  .sheet.on{transform:none} .sheet-bg.on{display:block}
  .sheet h3{font-size:20px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .kv{display:grid;grid-template-columns:76px 1fr;gap:9px 10px;font-size:15px}
  .kv dt{color:#888}
  .btn{width:100%;margin-top:18px;padding:13px;border-radius:12px;font-weight:700;font-size:15px;background:#f1f1f1}
  .btn.primary{background:var(--blue);color:#fff}

  .connect{max-width:420px;margin:40px auto;padding:0 20px}
  .connect h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .connect p{font-size:14px;color:#777;line-height:1.5;margin-bottom:8px}
  .connect label{display:block;font-size:12px;color:#888;margin:12px 0 4px}
  .connect input{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid #ddd;border-radius:10px}
  .connect .row{display:flex;gap:8px} .connect .row .btn{flex:1}
  .err{color:#c62e22;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>홈스테드<small>입실현황</small></h1>
    <button class="ibtn" id="btnSync" title="지금 동기화">⟳</button>
    <button class="ibtn" id="btnCfg" title="연결 설정">⚙</button>
  </header>
  <section class="today" id="today"></section>
  <div class="tl-wrap" id="wrap"><div class="tl" id="tl"></div></div>
  <div class="legend"><span>🧹 퇴실(청소)</span><span>바 = 실제 입실 (벤디트 인증)</span></div>
  <p style="font-size:11px;color:#aaa;padding:0 14px">내일 청소 예정은 지금까지 입실한 손님 기준이라, 오늘 밤 입실이 끝나면 확정돼.</p>
  <div class="stamp" id="stamp"></div>
</div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const COLORS = ['#3B9AE8','#F0648F','#E9AE00','#1FB58C','#B44FDB','#7FBF2A','#FF8A2B','#7B828A'];
const DEMO = new URLSearchParams(location.search).has('demo');
const PAST = 7, DAYS = 14, LEFT = 60;

const store = {
  get(k){ try { return localStorage.getItem('hs_'+k) || ''; } catch(_) { return ''; } },
  set(k,v){ try { localStorage.setItem('hs_'+k, v); } catch(_){} },
};
function importHash(){
  if (!/api=|key=/.test(location.hash)) return false;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('api')) store.set('api', h.get('api'));
  if (h.get('key')) store.set('key', h.get('key'));
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
importHash();
window.addEventListener('hashchange', () => { if (importHash()) { document.getElementById('connect')?.remove(); $('app').style.display=''; load(); } });

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W = ['일','월','화','수','목','금','토'];
const css = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

let ROOMS = [], LIST = [], TODAY = ymd(new Date());

async function call(action, extra){
  if (DEMO) return MOCK[action] ? MOCK[action]() : true;
  const api = store.get('api'), key = store.get('key');
  if (!api || !key) throw new Error('nocfg');
  const res = await fetch(api, { method:'POST', redirect:'follow', body: JSON.stringify(Object.assign({ key, action }, extra || {})) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'fail');
  return j.data;
}

async function load(){
  const start = ymd(addD(parse(TODAY), -PAST)), end = ymd(addD(parse(TODAY), DAYS - PAST));
  try {
    const d = await call('data', { from: start, to: end });
    ROOMS = d.rooms; LIST = d.list; TODAY = d.today || TODAY;
    $('stamp').textContent = `마지막 불러옴 ${d.now}`;
    render();
  } catch(err){
    if (err.message === 'key' || err.message === 'nocfg') return showConnect(err.message === 'key' ? '접근키가 맞지 않음' : '');
    toast('불러오기 실패'); console.error(err);
  }
}

/** 오늘 아침 기준: 어젯밤 이전 입실 → 오늘 퇴실 = 청소 / 퇴실 내일 이후 = 연박 / 오늘 입실 = 입실 완료 */
function todayState(){
  const clean = [], stay = [], inNow = [], next = [];
  const tmr = ymd(addD(parse(TODAY), 1));
  ROOMS.forEach(room => {
    const rs = LIST.filter(v => v.room === room);
    const s = rs.filter(v => v.ci < TODAY && v.co >= TODAY).sort((a,b)=>a.inAt<b.inAt?1:-1)[0];
    if (s && s.co === TODAY) clean.push(room);
    else if (s) stay.push(room);
    if (rs.some(v => v.ci === TODAY)) inNow.push(room);
    // 오늘 밤 투숙(연박 + 오늘 입실) 중 내일 퇴실
    if (rs.some(v => v.ci <= TODAY && v.co === tmr)) next.push(room);
  });
  return { clean, stay, inNow, next };
}

function render(){
  const t = todayState(), td = parse(TODAY);
  const chips = (a, empty) => a.length ? `<div class="rs">${a.map(r=>`<span>${r}</span>`).join('')}</div>` : `<div class="none">${empty}</div>`;
  const busy = new Set([...t.stay, ...t.inNow]);
  $('today').innerHTML = `<h2>오늘 ${md(TODAY)}(${W[td.getDay()]})</h2>
    <div class="cards">
      <div class="card clean"><div class="k">🧹 청소 (오늘 퇴실)</div><div class="v">${t.clean.length}</div>${chips(t.clean,'없음')}</div>
      <div class="card stay"><div class="k">⛔ 연박 (출입금지)</div><div class="v">${t.stay.length}</div>${chips(t.stay,'없음')}</div>
      <div class="card next"><div class="k">🗓 내일 청소 예정</div><div class="v">${t.next.length}</div>${chips(t.next,'아직 없음')}</div>
      <div class="card"><div class="k">오늘 밤 빈방</div><div class="v">${ROOMS.length - busy.size}</div>${chips(ROOMS.filter(r => !busy.has(r)), '만실')}</div>
    </div>`;

  const start = addD(td, -PAST);
  const days = Array.from({length: DAYS}, (_,i) => addD(start, i)), ds = days.map(ymd);
  let h = '<div class="corner"></div>';
  days.forEach((d,i) => {
    const cls = ['hd', d.getDay()===0?'sun':'', d.getDay()===6?'sat':'', ds[i]===TODAY?'t':''].join(' ');
    h += `<div class="${cls}">${W[d.getDay()]}<b>${d.getDate()}</b></div>`;
  });
  ROOMS.forEach((room, ri) => {
    h += `<div class="rm"><span class="dot" style="background:${COLORS[ri%COLORS.length]}"></span>${room}</div>`;
    ds.forEach(s => h += `<div class="cell ${s<TODAY?'past':''} ${s===TODAY?'t':''}"></div>`);
  });
  $('tl').innerHTML = h;

  const colW = css('--col'), rowH = css('--rowh'), headH = css('--head');
  // 입실 = 그 날 칸의 가운데(오후)부터, 퇴실 = 퇴실일 칸의 앞쪽(오전)까지 → 당일 퇴실·입실이 안 겹침
  const IN = 0.5, OUT = 0.42;
  LIST.forEach(v => {
    const ri = ROOMS.indexOf(v.room); if (ri < 0) return;
    const s = diff(ds[0], v.ci), e = diff(ds[0], v.co);
    const x1 = Math.max(s + IN, 0), x2 = Math.min(e + OUT, DAYS);
    const rowTop = headH + ri*rowH;
    if (x2 > x1) {
      const el = document.createElement('div');
      const w = (x2 - x1) * colW - 2, n = diff(v.ci, v.co);
      el.className = 'bar' + (s + IN < 0 ? ' contL' : '') + (w < 70 ? ' narrow' : '');
      el.style.cssText = `left:${LEFT + x1*colW + 1}px;width:${w}px;top:${rowTop + rowH - 28 - 6}px;background:${COLORS[ri%COLORS.length]}`;
      el.innerHTML = w < 70 ? `${n}박` : `${esc((v.inAt||'').slice(11))}<span class="sub">${n}박</span>`;
      el.onclick = () => openDetail(v);
      $('tl').appendChild(el);
    }
    if (e >= 0 && e < DAYS) {
      const m = document.createElement('div');
      m.className = 'out'; m.textContent = '🧹';
      m.style.cssText = `left:${LEFT + e*colW + 3}px;top:${rowTop + 3}px`;
      $('tl').appendChild(m);
    }
  });
  requestAnimationFrame(() => { $('wrap').scrollLeft = Math.max(0, (PAST - 2) * colW); });
}

function openDetail(v){
  const ri = ROOMS.indexOf(v.room);
  $('sheet').innerHTML = `<h3><span style="width:12px;height:12px;border-radius:50%;background:${COLORS[ri%COLORS.length]}"></span>${esc(v.room)}</h3>
    <dl class="kv">
      <dt>입실</dt><dd>${esc(v.inAt)}</dd>
      <dt>퇴실예정</dt><dd>${esc(v.outAt)} (${diff(v.ci, v.co)}박)</dd>
      <dt>구분</dt><dd>${esc(v.kind || '-')}</dd>
      <dt>벤디트</dt><dd>${esc(v.id || '-')}</dd>
    </dl>
    <button class="btn" id="cls">닫기</button>`;
  $('cls').onclick = closeSheet;
  $('bg').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('bg').classList.remove('on'); $('sheet').classList.remove('on'); }
$('bg').onclick = closeSheet;

function showConnect(msg){
  $('app').style.display = 'none';
  document.getElementById('connect')?.remove();
  const box = document.createElement('div');
  box.className = 'connect'; box.id = 'connect';
  box.innerHTML = `<h2>홈스테드 입실현황 연결</h2>
    <p>공유받은 링크로 열었다면 자동 연결돼. 직접 입력하려면 아래 두 칸.</p>
    <label>API 주소 (Apps Script 웹앱 /exec)</label><input id="cApi" value="${esc(store.get('api'))}" placeholder="https://script.google.com/macros/s/.../exec">
    <label>접근키</label><input id="cKey" type="password" value="${esc(store.get('key'))}">
    <div class="row"><button class="btn" onclick="location.search='?demo'">데모 보기</button><button class="btn primary" id="cGo">연결</button></div>
    <div class="err">${esc(msg||'')}</div>`;
  document.body.appendChild(box);
  $('cGo').onclick = () => { store.set('api', $('cApi').value.trim()); store.set('key', $('cKey').value.trim());
    box.remove(); $('app').style.display = ''; load(); };
}

$('btnCfg').onclick = () => { if (confirm('연결 정보를 다시 입력할까?')) showConnect(''); };
$('btnSync').onclick = async () => { toast('동기화 중…'); try { await call('sync'); await load(); toast('완료'); } catch(e){ toast('동기화 실패'); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('connect')) load(); });

// ── 데모 (?demo) — 가상의 데이터 ──
const MOCK = {
  data: () => {
    const t = new Date(), D = n => ymd(addD(t, n));
    let i = 0;
    const V = (room, a, b, hm) => ({ id: String(9000 + (++i)), room, ci: D(a), co: D(b),
      inAt: `${D(a)} ${hm}`, outAt: `${D(b)} 11:00`, kind: '예약입실', car: '차량없음' });
    return { rooms:['101호','102호','103호','104호','201호','202호','203호','204호'], today: D(0), now: '데모',
      list: [ V('101호',-1,0,'20:10'), V('101호',-4,-2,'16:30'), V('102호',-2,1,'15:40'), V('103호',-1,0,'22:05'),
        V('103호',-5,-4,'15:00'), V('104호',0,2,'15:20'), V('201호',-1,0,'19:20'), V('201호',-6,-4,'18:00'),
        V('202호',-3,2,'17:45'), V('203호',-5,-3,'21:10'), V('204호',0,1,'16:00'), V('204호',-2,0,'23:40') ] };
  }
};

load();
</script>
</body>
</html>
